services:

  api:
    build: ./api
    container_name: tool-session-api
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - rp-cloud-network

  db:
    image: postgres:17-alpine
    container_name: tool-session-db
    environment:
      POSTGRES_DB: rp_cloud_labs
      POSTGRES_USER: rp_user
      POSTGRES_PASSWORD: rp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rp_user -d rp_cloud_labs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rp-cloud-network

  redis:
    image: redis:7-alpine
    container_name: tool-session-redis
    ports:
      - "6379:6379"
    networks:
      - rp-cloud-network

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: tool-session-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - rp-cloud-network

networks:
  rp-cloud-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data: